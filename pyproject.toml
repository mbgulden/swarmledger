[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmledger"
version = "0.1.0"
description = "Cryptographic Merkle DAG & Causal Provenance Ledger for Multi-Agent Swarms"
license = "MIT"
readme = "README.md"
authors = [{ name = "Michael Gulden", email = "michael@growthwebdev.com" }]
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.scripts]
swarmledger = "swarmledger.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.16.9",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.urls]
Homepage = "https://github.com/mbgulden/swarmledger"
